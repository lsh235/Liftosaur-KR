name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            emulator
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Enable KVM and verify emulator acceleration
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa-artifacts/native-upgrade
          {
            echo "Runner identity and KVM device before permission setup:"
            id
            ls -l /dev/kvm || true
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=10
            echo "KVM device after permission setup:"
            ls -l /dev/kvm
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              echo "::error::The runner cannot read and write /dev/kvm after applying the KVM udev rule."
              exit 1
            fi
            echo "Android Emulator VM acceleration preflight:"
            set +e
            accel_check_output=$("$ANDROID_HOME/emulator/emulator" -accel-check 2>&1)
            accel_check_status=$?
            set -e
            printf '%s\n' "$accel_check_output"
            if [[ "$accel_check_status" -ne 0 ]]; then
              echo "::error::Android Emulator -accel-check failed; inspect this preflight log for runner and device diagnostics."
              exit 1
            fi
            if ! grep -Eq 'KVM.*installed and usable' <<< "$accel_check_output"; then
              echo "::error::Android Emulator reports that KVM acceleration is unavailable; refusing to run the native QA phase without VM acceleration."
              exit 1
            fi
          } 2>&1 | tee qa-artifacts/native-upgrade/kvm-preflight.log

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create default native build configuration
        run: npm run ensure:localdomain

      - name: Generate native bundle inputs
        run: npm run build:markdown

      - name: Prepare release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.LIFTOSAUR_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.LIFTOSAUR_ANDROID_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.LIFTOSAUR_ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.LIFTOSAUR_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/liftosaur-kr-release.keystore
          chmod 600 android/app/liftosaur-kr-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=liftosaur-kr-release.keystore
          storePassword=$ANDROID_RELEASE_STORE_PASSWORD
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          EOF

      - name: Run Android unit tests and build APK
        env:
          DISABLE_OTA: "true"
        run: |
          cd android
          ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 :app:testDebugUnitTest :app:assembleRelease

      - name: Upload Android unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results-${{ github.run_id }}
          path: |
            android/app/build/test-results/testDebugUnitTest/**/*.xml
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify APK signature and metadata
        id: verify_apk
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' android/app/build.gradle | head -n 1)"
          EXPECTED_VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*$/\1/p' android/app/build.gradle | head -n 1)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "v${EXPECTED_VERSION_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$EXPECTED_VERSION_NAME"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9.-]+)?$ ]]
          fi
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          apkanalyzer manifest application-id "$APK" | grep -Fx 'com.liftosaur.www.twa'
          apkanalyzer manifest version-code "$APK" | grep -Fx "$EXPECTED_VERSION_CODE"
          apkanalyzer manifest version-name "$APK" | grep -Fx "$EXPECTED_VERSION_NAME"
          cp "$APK" "Liftosaur-KR-${VERSION}.apk"
          sha256sum "Liftosaur-KR-${VERSION}.apk" > "Liftosaur-KR-${VERSION}.apk.sha256"
          echo "release_version=$VERSION" >> "$GITHUB_ENV"
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download published v158 upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qa-artifacts
          gh release download v158.0 \
            --repo lsh235/Liftosaur-KR \
            --pattern 'Liftosaur-KR-158.0.apk' \
            --pattern 'Liftosaur-KR-158.0.apk.sha256' \
            --dir qa-artifacts
          (cd qa-artifacts && sha256sum --check Liftosaur-KR-158.0.apk.sha256)

      - name: Generate validated synthetic v158 legacy-storage fixture
        run: |
          mkdir -p qa-artifacts/legacy-fixtures
          TS_NODE_TRANSPILE_ONLY=1 npx ts-node scripts/qa/create-legacy-storage-fixtures.ts qa-artifacts/legacy-fixtures

      - name: Install, upgrade, launch, and capture APK evidence in Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/qa/ko-release-emulator.sh
        env:
          BASELINE_APK: qa-artifacts/Liftosaur-KR-158.0.apk
          CANDIDATE_APK: Liftosaur-KR-${{ steps.verify_apk.outputs.release_version }}.apk
          FIXTURE_DIR: qa-artifacts/legacy-fixtures
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade

      - name: Verify required native upgrade evidence files
        if: success()
        env:
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          out = Path(os.environ["QA_ARTIFACTS_DIR"])
          required = [
              "RESULTS.txt",
              "signature-comparison.txt",
              "v158-package.txt",
              "v159-package.txt",
              "v158-mmkv-default.bin",
              "v159-mmkv-default.bin",
              "v158-before-upgrade.png",
              "v158-before-upgrade.xml",
              "v159-default.png",
              "v159-default.xml",
          ]
          for version in ("v158", "v159"):
              for account in ("primary", "secondary"):
                  required.extend(
                      [
                          f"{version}-{account}-measurement.xml",
                          f"{version}-{account}-completed-history-2x8x20kg.xml",
                      ]
                  )
          for capture in (
              "v159-workout-font-scale-1_3",
              "v159-workout-font-scale-2_0",
              "v159-workout-width-320dp-font-scale-1_0",
              "v159-workout-width-320dp-font-scale-2_0",
          ):
              required.extend([f"{capture}.png", f"{capture}.xml", f"{capture}-display-settings.txt"])

          missing = [str(out / name) for name in required if not (out / name).is_file() or (out / name).stat().st_size == 0]
          if missing:
              raise SystemExit("Required native QA evidence is missing or empty:\n" + "\n".join(missing))
          print(f"PASS: {len(required)} required native QA files exist and are non-empty (presence only).")
          PY

      - name: Upload candidate APK artifact
        if: always() && github.event_name == 'workflow_dispatch' && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Liftosaur-KR-${{ steps.verify_apk.outputs.release_version }}-candidate
          path: |
            Liftosaur-KR-${{ steps.verify_apk.outputs.release_version }}.apk
            Liftosaur-KR-${{ steps.verify_apk.outputs.release_version }}.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android install and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Liftosaur-KR-${{ steps.verify_apk.outputs.release_version }}-android-evidence
          path: qa-artifacts/native-upgrade/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$release_version"
          cat > release-notes.md <<EOF
          ## 설치 및 다운로드

          - [Liftosaur-KR-${VERSION}.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Liftosaur-KR-${VERSION}.apk): ARM64 Android 기기와 x86_64 에뮬레이터용 APK입니다. 다운로드한 뒤 파일을 열어 설치하세요. 브라우저나 파일 앱에서 '알 수 없는 앱 설치' 허용이 필요할 수 있습니다.
          - [SHA-256 체크섬](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Liftosaur-KR-${VERSION}.apk.sha256)
          - [6주 PHAT 평일 5일 예시 루틴 JSON](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/phat-6week-kr.json): 주 5회, 6주, 총 30세션의 운동 계획 예시입니다.

          이 APK는 기존 한국어 Liftosaur-KR 158.0과 같은 Android 패키지 ID를 유지해 해당 앱의 업데이트 대상으로 빌드했습니다. 설치 전에 기존 데이터를 앱의 전체 내보내기 기능으로 백업하세요. Android가 서명 불일치로 업데이트를 거부하면 기존 앱을 삭제하지 말고, 앱과 기록을 그대로 보존한 뒤 문제를 제보해 주세요. 공식 Liftosaur 앱은 서명·패키지가 다를 수 있으므로 이 APK를 설치하기 위해 공식 앱을 삭제하지 마세요.

          예시 JSON을 사용하려면 앱 설정 화면의 '가져오기 / 내보내기'에서 'AI 운동 루틴 JSON/CSV 가져오기'를 선택하고 다운로드한 파일을 고르세요. 이 계획의 중량은 예시이며 개인 권장 중량이 아니므로 시작 전에 본인 기록과 사용 기구에 맞게 조정하세요.

          ## 이번 후보의 변경

          - 코드/앱 버전: ${GITHUB_SHA} / ${VERSION} (Android versionCode $(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' android/app/build.gradle | head -n 1)).
          - 네이티브 기본 배포를 로컬 기록 중심으로 제한하고, 클라우드 계정·구독 기능을 안내 화면으로 전환했습니다. 원격 운동 이미지는 계속 불러올 수 있습니다.
          - 한국어 운동 기록·가져오기/내보내기 흐름을 개선했습니다. 앱 데이터 자동 이전이나 모든 데이터 복원은 보장하지 않습니다.

          이 GitHub 릴리스는 사전 공개(pre-release) 테스트 후보입니다. 운영 담당자와 정식 정책이 아직 정해지지 않아 Google Play 정식 출시는 준비 중입니다.

          GitHub Actions는 Android 단위 검사, 서명·패키지·버전 메타데이터 검사, 합성 legacy 파일로 v158.0의 로컬 계정·운동 기록을 구성한 뒤 v159 업데이트와 화면 읽기를 시도합니다. 합성 자료는 실제 사용자가 만든 기록이 아닙니다. 이 절차는 사용자 기록에 대한 의미상 완전성 비교, 실제 기기 사용성 평가, 파일 백업 복원, Health Connect/알림 권한 검증을 대신하지 않습니다. 검증 로그와 캡처는 Actions 아티팩트를 확인하세요.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "Liftosaur-KR-${VERSION}.apk#Android APK" \
            "Liftosaur-KR-${VERSION}.apk.sha256#SHA-256 checksum" \
            "examples/phat-6week-kr.json#6-week PHAT example routine" \
            --title "Liftosaur-KR ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
