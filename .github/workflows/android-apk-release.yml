name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            emulator
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Enable KVM and verify emulator acceleration
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa-artifacts/native-upgrade
          {
            echo "Runner identity and KVM device before permission setup:"
            id
            ls -l /dev/kvm || true
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=10
            echo "KVM device after permission setup:"
            ls -l /dev/kvm
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              echo "::error::The runner cannot read and write /dev/kvm after applying the KVM udev rule."
              exit 1
            fi
            echo "Android Emulator VM acceleration preflight:"
            set +e
            accel_check_output=$("$ANDROID_HOME/emulator/emulator" -accel-check 2>&1)
            accel_check_status=$?
            set -e
            printf '%s\n' "$accel_check_output"
            if [[ "$accel_check_status" -ne 0 ]]; then
              echo "::error::Android Emulator -accel-check failed; inspect this preflight log for runner and device diagnostics."
              exit 1
            fi
            if ! grep -Eq 'KVM.*installed and usable' <<< "$accel_check_output"; then
              echo "::error::Android Emulator reports that KVM acceleration is unavailable; refusing to run the native QA phase without VM acceleration."
              exit 1
            fi
          } 2>&1 | tee qa-artifacts/native-upgrade/kvm-preflight.log

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create default native build configuration
        run: npm run ensure:localdomain

      - name: Generate native bundle inputs
        run: npm run build:markdown

      - name: Prepare release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.LIFTOSAUR_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.LIFTOSAUR_ANDROID_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.LIFTOSAUR_ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.LIFTOSAUR_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/liftosaur-kr-release.keystore
          chmod 600 android/app/liftosaur-kr-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=liftosaur-kr-release.keystore
          storePassword=$ANDROID_RELEASE_STORE_PASSWORD
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          EOF

      - name: Run Android unit tests and build APK
        env:
          DISABLE_OTA: "true"
        run: |
          cd android
          ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 :app:testDebugUnitTest :app:assembleRelease

      - name: Upload Android unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results-${{ github.run_id }}
          path: |
            android/app/build/test-results/testDebugUnitTest/**/*.xml
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify APK signature and metadata
        id: verify_apk
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' android/app/build.gradle | head -n 1)"
          EXPECTED_VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*$/\1/p' android/app/build.gradle | head -n 1)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "v${EXPECTED_VERSION_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$EXPECTED_VERSION_NAME"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9.-]+)?$ ]]
          fi
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          apkanalyzer manifest application-id "$APK" | grep -Fx 'com.liftosaur.www.twa'
          apkanalyzer manifest version-code "$APK" | grep -Fx "$EXPECTED_VERSION_CODE"
          apkanalyzer manifest version-name "$APK" | grep -Fx "$EXPECTED_VERSION_NAME"
          cp "$APK" "TigerFit-${VERSION}.apk"
          sha256sum "TigerFit-${VERSION}.apk" > "TigerFit-${VERSION}.apk.sha256"
          echo "release_version=$VERSION" >> "$GITHUB_ENV"
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download published v158 upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qa-artifacts
          gh release download v158.0 \
            --repo lsh235/Liftosaur-KR \
            --pattern 'Liftosaur-KR-158.0.apk' \
            --pattern 'Liftosaur-KR-158.0.apk.sha256' \
            --dir qa-artifacts
          (cd qa-artifacts && sha256sum --check Liftosaur-KR-158.0.apk.sha256)

      - name: Generate validated synthetic v158 legacy-storage fixture
        run: |
          mkdir -p qa-artifacts/legacy-fixtures
          TS_NODE_TRANSPILE_ONLY=1 npx ts-node scripts/qa/create-legacy-storage-fixtures.ts qa-artifacts/legacy-fixtures

      - name: Install, upgrade, launch, and capture APK evidence in Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/qa/ko-release-emulator.sh
        env:
          BASELINE_APK: qa-artifacts/Liftosaur-KR-158.0.apk
          CANDIDATE_VERSION: ${{ steps.verify_apk.outputs.release_version }}
          CANDIDATE_APK: TigerFit-${{ steps.verify_apk.outputs.release_version }}.apk
          FIXTURE_DIR: qa-artifacts/legacy-fixtures
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade

      - name: Verify required native upgrade evidence files
        if: success()
        env:
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade
          CANDIDATE_VERSION: ${{ steps.verify_apk.outputs.release_version }}
        run: |
          python3 scripts/qa/verify_native_upgrade_evidence.py "$CANDIDATE_VERSION" "$QA_ARTIFACTS_DIR"

      - name: Upload candidate APK artifact
        if: always() && github.event_name == 'workflow_dispatch' && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TigerFit-${{ steps.verify_apk.outputs.release_version }}-candidate
          path: |
            TigerFit-${{ steps.verify_apk.outputs.release_version }}.apk
            TigerFit-${{ steps.verify_apk.outputs.release_version }}.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android install and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TigerFit-${{ steps.verify_apk.outputs.release_version }}-android-evidence
          path: qa-artifacts/native-upgrade/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$release_version"
          cat > release-notes.md <<EOF
          ## 설치 및 다운로드

          - [TigerFit-${VERSION}.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/TigerFit-${VERSION}.apk): ARM64 Android 기기와 x86_64 에뮬레이터용 APK입니다. 다운로드한 뒤 파일을 열어 설치하세요. 브라우저나 파일 앱에서 '알 수 없는 앱 설치' 허용이 필요할 수 있습니다.
          - [SHA-256 체크섬](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/TigerFit-${VERSION}.apk.sha256)
          - [6주 PHAT 평일 5일 예시 루틴 JSON](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/phat-6week-kr.json): 주 5회, 6주, 총 30세션의 운동 계획 예시입니다.

          이 APK는 기존 한국어 Liftosaur-KR 158.0과 같은 Android 패키지 ID를 유지해 해당 앱의 업데이트 대상으로 빌드했습니다. 설치 전에 기존 데이터를 앱의 전체 내보내기 기능으로 백업하세요. Android가 서명 불일치로 업데이트를 거부하면 기존 앱을 삭제하지 말고, 앱과 기록을 그대로 보존한 뒤 문제를 제보해 주세요. 공식 Liftosaur 앱은 서명·패키지가 다를 수 있으므로 이 APK를 설치하기 위해 공식 앱을 삭제하지 마세요.

          예시 JSON을 사용하려면 앱 설정 화면의 '가져오기 / 내보내기'에서 'AI 운동 루틴 JSON/CSV 가져오기'를 선택하고 다운로드한 파일을 고르세요. 이 계획의 중량은 예시이며 개인 권장 중량이 아니므로 시작 전에 본인 기록과 사용 기구에 맞게 조정하세요.

          ## 이번 후보의 변경

          - 코드/앱 버전: ${GITHUB_SHA} / ${VERSION} (Android versionCode $(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' android/app/build.gradle | head -n 1)).
          - 앱 표시 이름과 브랜딩을 TigerFit으로 변경했습니다.
          - 신체 측정, 운동 기록, 건강 통계 그래프와 이동 평균 설정을 Premium 구독 없이 사용할 수 있습니다. 다른 Premium 혜택은 기존 구독 조건을 유지합니다.
          - 네이티브 앱은 로컬 기록을 유지하며 앱 내 결제를 제공하지 않습니다. TigerFit 이메일 계정으로 로그인하고 동의하면 기기의 운동 기록과 프로그램을 계정에 합칩니다.
          - 한국어 운동 기록·가져오기/내보내기 흐름을 개선했습니다. 앱 데이터 자동 이전이나 모든 데이터 복원은 보장하지 않습니다.
          - [TigerFit 웹 앱](https://tigerfit.aixtech.uk/app/)과 [MCP 서버](https://tigerfit.aixtech.uk/mcp)는 같은 계정을 사용합니다. 앱에서 같은 이메일 계정에 로그인하면 Codex가 운동 기록을 읽고 프로그램을 조정할 수 있으며, 앱이 열려 있을 때 약 30초 안에 변경 사항을 동기화합니다.

          이 GitHub 릴리스는 사전 공개(pre-release) 테스트 후보입니다. 운영 담당자와 정식 정책이 아직 정해지지 않아 Google Play 정식 출시는 준비 중입니다.

          GitHub Actions는 Android 단위 검사, 서명·패키지·버전 메타데이터 검사, 합성 legacy 파일로 v158.0의 로컬 계정·운동 기록을 구성한 뒤 ${VERSION} 업데이트와 화면 읽기를 시도합니다. 합성 자료는 실제 사용자가 만든 기록이 아닙니다. 이 절차는 사용자 기록에 대한 의미상 완전성 비교, 실제 기기 사용성 평가, 파일 백업 복원, Health Connect/알림 권한 검증을 대신하지 않습니다. 검증 로그와 캡처는 Actions 아티팩트를 확인하세요.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "TigerFit-${VERSION}.apk#Android APK" \
            "TigerFit-${VERSION}.apk.sha256#SHA-256 checksum" \
            "examples/phat-6week-kr.json#6-week PHAT example routine" \
            --title "TigerFit ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag

  validate-existing-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require candidate validation branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/codex/kr-v159-candidate" ]]; then
            echo "::error::Dispatch this workflow only from refs/heads/codex/kr-v159-candidate (received $GITHUB_REF)."
            exit 1
          fi

      - name: Check out validation source
        uses: actions/checkout@v7

      - name: Create evidence directory
        id: init_evidence
        run: |
          mkdir -p qa-artifacts/native-upgrade qa-artifacts/candidate
          {
            echo "validation_run_id=${GITHUB_RUN_ID}"
            echo "validation_ref=${GITHUB_REF}"
            echo "validation_sha=${GITHUB_SHA}"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > qa-artifacts/native-upgrade/validation-run.txt

      - name: Verify pinned C5 run and candidate artifact exist
        id: candidate_source
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 40050236743;
            const artifactName = "Liftosaur-KR-159.0-candidate";
            const expectedHeadSha = "5b6750564eb34f74956912d8b488b3c06651c090";
            const response = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = response.data;
            const sourceWorkflowPath = run.path?.split("@")[0];
            if (run.id !== runId || run.status !== "completed" ||
                sourceWorkflowPath !== ".github/workflows/android-apk-release.yml" ||
                run.event !== "workflow_dispatch" ||
                run.head_branch !== "codex/kr-v159-candidate" ||
                run.head_sha !== expectedHeadSha) {
              throw new Error(`Run ${runId} does not match the pinned C5 source identity: ${JSON.stringify({id: run.id, status: run.status, path: run.path, normalized_path: sourceWorkflowPath, event: run.event, head_branch: run.head_branch, head_sha: run.head_sha})}`);
            }
            const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const matches = artifactResponse.data.artifacts.filter((item) => item.name === artifactName);
            if (matches.length !== 1 || matches[0].expired || matches[0].size_in_bytes <= 0) {
              throw new Error(`Pinned artifact ${artifactName} must exist exactly once, be unexpired, and be nonempty before download`);
            }
            const artifact = matches[0];
            const record = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              source_run_id: run.id,
              source_run_url: run.html_url,
              source_workflow: run.name,
              source_event: run.event,
              source_status: run.status,
              source_conclusion: run.conclusion,
              source_head_branch: run.head_branch,
              source_head_sha: run.head_sha,
              source_workflow_path: sourceWorkflowPath,
              artifact_name: artifact.name,
              artifact_id: artifact.id,
              artifact_size_bytes: artifact.size_in_bytes,
              artifact_expired: artifact.expired,
              artifact_created_at: artifact.created_at,
              artifact_expires_at: artifact.expires_at,
              expected_apk_sha256: "40ddf3a343313e904eb2684006520517a9bb395965f9d750da96f0b6cf68f699",
              validation_workflow_run_id: context.runId,
              validation_ref: context.ref,
              validation_sha: context.sha,
            };
            core.info(`Candidate artifact provenance: ${JSON.stringify(record)}`);
            core.setOutput("record", JSON.stringify(record, null, 2));

      - name: Save candidate artifact provenance
        env:
          CANDIDATE_SOURCE_JSON: ${{ steps.candidate_source.outputs.record }}
        run: |
          printf '%s\n' "$CANDIDATE_SOURCE_JSON" > qa-artifacts/native-upgrade/candidate-source.json

      - name: Download candidate APK artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: Liftosaur-KR-159.0-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "40050236743"
          path: qa-artifacts/candidate

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            emulator

      - name: Verify candidate checksum, signature, and manifest metadata
        id: verify_candidate
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA256: "40ddf3a343313e904eb2684006520517a9bb395965f9d750da96f0b6cf68f699"
        run: |
          set -Eeuo pipefail
          EXPECTED_APPLICATION_ID="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]+"([^"]+)".*$/\1/p' android/app/build.gradle | head -n 1)"
          EXPECTED_VERSION_CODE="159"
          EXPECTED_VERSION_NAME="159.0"
          test -n "$EXPECTED_APPLICATION_ID"
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          VERSION="$EXPECTED_VERSION_NAME"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9.-]+)?$ ]]
          APK_NAME="Liftosaur-KR-${VERSION}.apk"
          APK_PATH="qa-artifacts/candidate/${APK_NAME}"
          CHECKSUM_PATH="${APK_PATH}.sha256"
          test -s "$APK_PATH"
          test -s "$CHECKSUM_PATH"
          test "$(find qa-artifacts/candidate -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" = 1
          (cd qa-artifacts/candidate && sha256sum --check --strict "${APK_NAME}.sha256")
          ACTUAL_CANDIDATE_SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          test "$ACTUAL_CANDIDATE_SHA256" = "$EXPECTED_CANDIDATE_SHA256"
          cp "$CHECKSUM_PATH" qa-artifacts/native-upgrade/candidate-artifact.sha256
          {
            echo "source_run_id=40050236743"
            echo "source_workflow_path=.github/workflows/android-apk-release.yml"
            echo "source_event=workflow_dispatch"
            echo "source_head_branch=codex/kr-v159-candidate"
            echo "source_head_sha=5b6750564eb34f74956912d8b488b3c06651c090"
            echo "artifact_name=Liftosaur-KR-159.0-candidate"
            echo "apk_name=${APK_NAME}"
            echo "apk_size_bytes=$(stat -c '%s' "$APK_PATH")"
            echo "apk_sha256=${ACTUAL_CANDIDATE_SHA256}"
            echo "expected_application_id=${EXPECTED_APPLICATION_ID}"
            echo "expected_version_code=${EXPECTED_VERSION_CODE}"
            echo "expected_version_name=${EXPECTED_VERSION_NAME}"
          } | tee qa-artifacts/native-upgrade/candidate-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH" 2>&1 | tee qa-artifacts/native-upgrade/candidate-signature-verification.txt
          ACTUAL_APPLICATION_ID="$(apkanalyzer manifest application-id "$APK_PATH")"
          ACTUAL_VERSION_CODE="$(apkanalyzer manifest version-code "$APK_PATH")"
          ACTUAL_VERSION_NAME="$(apkanalyzer manifest version-name "$APK_PATH")"
          printf 'applicationId=%s\nversionCode=%s\nversionName=%s\n' \
            "$ACTUAL_APPLICATION_ID" "$ACTUAL_VERSION_CODE" "$ACTUAL_VERSION_NAME" \
            | tee qa-artifacts/native-upgrade/candidate-manifest.txt
          test "$ACTUAL_APPLICATION_ID" = "$EXPECTED_APPLICATION_ID"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Download published v158 upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p qa-artifacts
          gh release download v158.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Liftosaur-KR-158.0.apk' \
            --pattern 'Liftosaur-KR-158.0.apk.sha256' \
            --dir qa-artifacts
          (cd qa-artifacts && sha256sum --check --strict Liftosaur-KR-158.0.apk.sha256)

      - name: Verify candidate signer matches v158 before emulator setup
        shell: bash
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs qa-artifacts/Liftosaur-KR-158.0.apk \
            > qa-artifacts/native-upgrade/v158-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${{ steps.verify_candidate.outputs.apk_path }}" \
            > qa-artifacts/native-upgrade/candidate-signature.txt
          baseline_cert="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' qa-artifacts/native-upgrade/v158-signature.txt | head -n 1)"
          candidate_cert="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' qa-artifacts/native-upgrade/candidate-signature.txt | head -n 1)"
          test -n "$baseline_cert" && test "$baseline_cert" = "$candidate_cert"
          printf 'v158 SHA-256: %s\ncandidate SHA-256: %s\n' "$baseline_cert" "$candidate_cert" \
            | tee qa-artifacts/native-upgrade/pre-emulator-signature-comparison.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate markdown modules required by the legacy fixture
        run: npm run build:markdown

      - name: Generate validated synthetic v158 legacy-storage fixture
        run: |
          mkdir -p qa-artifacts/legacy-fixtures
          TS_NODE_TRANSPILE_ONLY=1 npx ts-node scripts/qa/create-legacy-storage-fixtures.ts qa-artifacts/legacy-fixtures

      - name: Enable KVM and verify emulator acceleration
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "Runner identity and KVM device before permission setup:"
            id
            ls -l /dev/kvm || true
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=10
            echo "KVM device after permission setup:"
            ls -l /dev/kvm
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              echo "::error::The runner cannot read and write /dev/kvm after applying the KVM udev rule."
              exit 1
            fi
            echo "Android Emulator VM acceleration preflight:"
            set +e
            accel_check_output=$("$ANDROID_HOME/emulator/emulator" -accel-check 2>&1)
            accel_check_status=$?
            set -e
            printf '%s\n' "$accel_check_output"
            if [[ "$accel_check_status" -ne 0 ]]; then
              echo "::error::Android Emulator -accel-check failed; inspect this preflight log for runner and device diagnostics."
              exit 1
            fi
            if ! grep -Eq 'KVM.*installed and usable' <<< "$accel_check_output"; then
              echo "::error::Android Emulator reports that KVM acceleration is unavailable; refusing to run native QA without VM acceleration."
              exit 1
            fi
          } 2>&1 | tee qa-artifacts/native-upgrade/kvm-preflight.log

      - name: Install, upgrade, launch, and capture APK evidence in Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/qa/ko-release-emulator.sh
        env:
          BASELINE_APK: qa-artifacts/Liftosaur-KR-158.0.apk
          CANDIDATE_VERSION: "159.0"
          CANDIDATE_APK: ${{ steps.verify_candidate.outputs.apk_path }}
          FIXTURE_DIR: qa-artifacts/legacy-fixtures
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade

      - name: Verify required native upgrade evidence files
        if: success()
        env:
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade
          CANDIDATE_VERSION: "159.0"
        run: |
          python3 scripts/qa/verify_native_upgrade_evidence.py "$CANDIDATE_VERSION" "$QA_ARTIFACTS_DIR" \
            validation-run.txt candidate-source.json candidate-artifact.sha256 candidate-verification.txt \
            candidate-signature-verification.txt candidate-manifest.txt v158-signature.txt \
            candidate-signature.txt pre-emulator-signature-comparison.txt kvm-preflight.log

      - name: Upload Android candidate validation evidence
        if: always() && steps.init_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Liftosaur-KR-159.0-existing-artifact-validation-${{ github.run_id }}
          path: qa-artifacts/native-upgrade/
          if-no-files-found: error
          retention-days: 30
