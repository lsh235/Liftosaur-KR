name: Validate Existing Android Candidate Artifact

on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: android-apk-validate-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-existing-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require candidate validation branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/codex/kr-v159-candidate" ]]; then
            echo "::error::Dispatch this workflow only from refs/heads/codex/kr-v159-candidate (received $GITHUB_REF)."
            exit 1
          fi

      - name: Check out validation source
        uses: actions/checkout@v7

      - name: Create evidence directory
        id: init_evidence
        run: |
          mkdir -p qa-artifacts/native-upgrade qa-artifacts/candidate
          {
            echo "validation_run_id=${GITHUB_RUN_ID}"
            echo "validation_ref=${GITHUB_REF}"
            echo "validation_sha=${GITHUB_SHA}"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > qa-artifacts/native-upgrade/validation-run.txt

      - name: Verify pinned C5 run and candidate artifact exist
        id: candidate_source
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 40050236743;
            const artifactName = "Liftosaur-KR-159.0-candidate";
            const expectedHeadSha = "5b6750564eb34f74956912d8b488b3c06651c090";
            const response = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = response.data;
            const sourceWorkflowPath = run.path?.split("@")[0];
            if (run.id !== runId || run.status !== "completed" ||
                sourceWorkflowPath !== ".github/workflows/android-apk-release.yml" ||
                run.event !== "workflow_dispatch" ||
                run.head_branch !== "codex/kr-v159-candidate" ||
                run.head_sha !== expectedHeadSha) {
              throw new Error(`Run ${runId} does not match the pinned C5 source identity: ${JSON.stringify({id: run.id, status: run.status, path: run.path, normalized_path: sourceWorkflowPath, event: run.event, head_branch: run.head_branch, head_sha: run.head_sha})}`);
            }
            const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const matches = artifactResponse.data.artifacts.filter((item) => item.name === artifactName);
            if (matches.length !== 1 || matches[0].expired || matches[0].size_in_bytes <= 0) {
              throw new Error(`Pinned artifact ${artifactName} must exist exactly once, be unexpired, and be nonempty before download`);
            }
            const artifact = matches[0];
            const record = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              source_run_id: run.id,
              source_run_url: run.html_url,
              source_workflow: run.name,
              source_event: run.event,
              source_status: run.status,
              source_conclusion: run.conclusion,
              source_head_branch: run.head_branch,
              source_head_sha: run.head_sha,
              source_workflow_path: sourceWorkflowPath,
              artifact_name: artifact.name,
              artifact_id: artifact.id,
              artifact_size_bytes: artifact.size_in_bytes,
              artifact_expired: artifact.expired,
              artifact_created_at: artifact.created_at,
              artifact_expires_at: artifact.expires_at,
              expected_apk_sha256: "40ddf3a343313e904eb2684006520517a9bb395965f9d750da96f0b6cf68f699",
              validation_workflow_run_id: context.runId,
              validation_ref: context.ref,
              validation_sha: context.sha,
            };
            core.info(`Candidate artifact provenance: ${JSON.stringify(record)}`);
            core.setOutput("record", JSON.stringify(record, null, 2));

      - name: Save candidate artifact provenance
        env:
          CANDIDATE_SOURCE_JSON: ${{ steps.candidate_source.outputs.record }}
        run: |
          printf '%s\n' "$CANDIDATE_SOURCE_JSON" > qa-artifacts/native-upgrade/candidate-source.json

      - name: Download candidate APK artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: Liftosaur-KR-159.0-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "40050236743"
          path: qa-artifacts/candidate

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            emulator

      - name: Verify candidate checksum, signature, and manifest metadata
        id: verify_candidate
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA256: "40ddf3a343313e904eb2684006520517a9bb395965f9d750da96f0b6cf68f699"
        run: |
          set -Eeuo pipefail
          EXPECTED_APPLICATION_ID="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]+"([^"]+)".*$/\1/p' android/app/build.gradle | head -n 1)"
          EXPECTED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' android/app/build.gradle | head -n 1)"
          EXPECTED_VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*$/\1/p' android/app/build.gradle | head -n 1)"
          test -n "$EXPECTED_APPLICATION_ID"
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          VERSION="$EXPECTED_VERSION_NAME"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9.-]+)?$ ]]
          APK_NAME="Liftosaur-KR-${VERSION}.apk"
          APK_PATH="qa-artifacts/candidate/${APK_NAME}"
          CHECKSUM_PATH="${APK_PATH}.sha256"
          test -s "$APK_PATH"
          test -s "$CHECKSUM_PATH"
          test "$(find qa-artifacts/candidate -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" = 1
          (cd qa-artifacts/candidate && sha256sum --check --strict "${APK_NAME}.sha256")
          ACTUAL_CANDIDATE_SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          test "$ACTUAL_CANDIDATE_SHA256" = "$EXPECTED_CANDIDATE_SHA256"
          cp "$CHECKSUM_PATH" qa-artifacts/native-upgrade/candidate-artifact.sha256
          {
            echo "source_run_id=40050236743"
            echo "source_workflow_path=.github/workflows/android-apk-release.yml"
            echo "source_event=workflow_dispatch"
            echo "source_head_branch=codex/kr-v159-candidate"
            echo "source_head_sha=5b6750564eb34f74956912d8b488b3c06651c090"
            echo "artifact_name=Liftosaur-KR-159.0-candidate"
            echo "apk_name=${APK_NAME}"
            echo "apk_size_bytes=$(stat -c '%s' "$APK_PATH")"
            echo "apk_sha256=${ACTUAL_CANDIDATE_SHA256}"
            echo "expected_application_id=${EXPECTED_APPLICATION_ID}"
            echo "expected_version_code=${EXPECTED_VERSION_CODE}"
            echo "expected_version_name=${EXPECTED_VERSION_NAME}"
          } | tee qa-artifacts/native-upgrade/candidate-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH" 2>&1 | tee qa-artifacts/native-upgrade/candidate-signature-verification.txt
          ACTUAL_APPLICATION_ID="$(apkanalyzer manifest application-id "$APK_PATH")"
          ACTUAL_VERSION_CODE="$(apkanalyzer manifest version-code "$APK_PATH")"
          ACTUAL_VERSION_NAME="$(apkanalyzer manifest version-name "$APK_PATH")"
          printf 'applicationId=%s\nversionCode=%s\nversionName=%s\n' \
            "$ACTUAL_APPLICATION_ID" "$ACTUAL_VERSION_CODE" "$ACTUAL_VERSION_NAME" \
            | tee qa-artifacts/native-upgrade/candidate-manifest.txt
          test "$ACTUAL_APPLICATION_ID" = "$EXPECTED_APPLICATION_ID"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Download published v158 upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p qa-artifacts
          gh release download v158.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Liftosaur-KR-158.0.apk' \
            --pattern 'Liftosaur-KR-158.0.apk.sha256' \
            --dir qa-artifacts
          (cd qa-artifacts && sha256sum --check --strict Liftosaur-KR-158.0.apk.sha256)

      - name: Verify candidate signer matches v158 before emulator setup
        shell: bash
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs qa-artifacts/Liftosaur-KR-158.0.apk \
            > qa-artifacts/native-upgrade/v158-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${{ steps.verify_candidate.outputs.apk_path }}" \
            > qa-artifacts/native-upgrade/candidate-signature.txt
          baseline_cert="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' qa-artifacts/native-upgrade/v158-signature.txt | head -n 1)"
          candidate_cert="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' qa-artifacts/native-upgrade/candidate-signature.txt | head -n 1)"
          test -n "$baseline_cert" && test "$baseline_cert" = "$candidate_cert"
          printf 'v158 SHA-256: %s\ncandidate SHA-256: %s\n' "$baseline_cert" "$candidate_cert" \
            | tee qa-artifacts/native-upgrade/pre-emulator-signature-comparison.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate validated synthetic v158 legacy-storage fixture
        run: |
          mkdir -p qa-artifacts/legacy-fixtures
          TS_NODE_TRANSPILE_ONLY=1 npx ts-node scripts/qa/create-legacy-storage-fixtures.ts qa-artifacts/legacy-fixtures

      - name: Enable KVM and verify emulator acceleration
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "Runner identity and KVM device before permission setup:"
            id
            ls -l /dev/kvm || true
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=10
            echo "KVM device after permission setup:"
            ls -l /dev/kvm
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              echo "::error::The runner cannot read and write /dev/kvm after applying the KVM udev rule."
              exit 1
            fi
            echo "Android Emulator VM acceleration preflight:"
            set +e
            accel_check_output=$("$ANDROID_HOME/emulator/emulator" -accel-check 2>&1)
            accel_check_status=$?
            set -e
            printf '%s\n' "$accel_check_output"
            if [[ "$accel_check_status" -ne 0 ]]; then
              echo "::error::Android Emulator -accel-check failed; inspect this preflight log for runner and device diagnostics."
              exit 1
            fi
            if ! grep -Eq 'KVM.*installed and usable' <<< "$accel_check_output"; then
              echo "::error::Android Emulator reports that KVM acceleration is unavailable; refusing to run native QA without VM acceleration."
              exit 1
            fi
          } 2>&1 | tee qa-artifacts/native-upgrade/kvm-preflight.log

      - name: Install, upgrade, launch, and capture APK evidence in Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/qa/ko-release-emulator.sh
        env:
          BASELINE_APK: qa-artifacts/Liftosaur-KR-158.0.apk
          CANDIDATE_APK: ${{ steps.verify_candidate.outputs.apk_path }}
          FIXTURE_DIR: qa-artifacts/legacy-fixtures
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade

      - name: Verify required native upgrade evidence files
        if: success()
        env:
          QA_ARTIFACTS_DIR: qa-artifacts/native-upgrade
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          out = Path(os.environ["QA_ARTIFACTS_DIR"])
          required = [
              "validation-run.txt",
              "candidate-source.json",
              "candidate-artifact.sha256",
              "candidate-verification.txt",
              "candidate-signature-verification.txt",
              "candidate-manifest.txt",
              "v158-signature.txt",
              "candidate-signature.txt",
              "pre-emulator-signature-comparison.txt",
              "kvm-preflight.log",
              "RESULTS.txt",
              "signature-comparison.txt",
              "v158-package.txt",
              "v159-package.txt",
              "v158-mmkv-default.bin",
              "v159-mmkv-default.bin",
              "v158-before-upgrade.png",
              "v158-before-upgrade.xml",
              "v159-default.png",
              "v159-default.xml",
          ]
          for version in ("v158", "v159"):
              for account in ("primary", "secondary"):
                  required.extend([
                      f"{version}-{account}-measurement.xml",
                      f"{version}-{account}-completed-history-2x8x20kg.xml",
                  ])
          for capture in (
              "v159-workout-font-scale-1_3",
              "v159-workout-font-scale-2_0",
              "v159-workout-width-320dp-font-scale-1_0",
              "v159-workout-width-320dp-font-scale-2_0",
          ):
              required.extend([f"{capture}.png", f"{capture}.xml", f"{capture}-display-settings.txt"])
          missing = [str(out / name) for name in required if not (out / name).is_file() or (out / name).stat().st_size == 0]
          if missing:
              raise SystemExit("Required native QA evidence is missing or empty:\n" + "\n".join(missing))
          print(f"PASS: {len(required)} required native QA files exist and are non-empty (presence only).")
          PY

      - name: Upload Android candidate validation evidence
        if: always() && steps.init_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Liftosaur-KR-${{ steps.verify_candidate.outputs.version }}-existing-artifact-validation-${{ github.run_id }}
          path: qa-artifacts/native-upgrade/
          if-no-files-found: error
          retention-days: 30
